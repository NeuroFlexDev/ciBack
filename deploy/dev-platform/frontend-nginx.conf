server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /legal/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location /assets/ { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location ~ ^/(admin|invite|auth|privacy|account|forgot-password|reset-password|dashboard|employees|analytics|courses|express|templates|ai-helper|learning|reviews|course-reviews|groups|assignments|programs|team-settings|learning-analytics|integrations|billing)(/.*)?$ {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
}
