name: lernium-customer

x-app: &app
  image: ${BACKEND_IMAGE:?Set immutable backend image digest}
  env_file: runtime.env
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [data, outbound]
  volumes: [uploads:/data/uploads]

services:
  edge:
    image: ${CADDY_IMAGE:?Set immutable Caddy image digest}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set public DNS hostname}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [web, outbound]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}

  frontend:
    image: ${FRONTEND_IMAGE:?Set immutable frontend image digest}
    restart: unless-stopped
    networks: [web]
    volumes: ["./frontend.conf:/etc/nginx/conf.d/default.conf:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    <<: *app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "10.77.0.0/24"]
    networks: [data, outbound, web]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s

  worker:
    <<: *app
    command: ["rq", "worker", "generation", "--with-scheduler", "--url", "redis://redis:6379/0"]
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; from rq import Worker; from datetime import datetime,timezone; ws=Worker.all(connection=Redis.from_url('redis://redis:6379/0')); assert any(w.last_heartbeat and (datetime.now(timezone.utc)-w.last_heartbeat).total_seconds()<180 for w in ws)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  outbox:
    <<: *app
    command: ["python", "-m", "app.workers.outbox"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time()-Path('/tmp/lernium-outbox-heartbeat').stat().st_mtime<120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}

  maintenance:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    command: ["python", "-m", "scripts.purge_delivery_secrets"]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      db: {condition: service_healthy}

  db:
    image: ${POSTGRES_IMAGE:?Set immutable PostgreSQL image digest}
    restart: unless-stopped
    env_file: database.env
    volumes: [db:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:?Set immutable Redis image digest}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  web:
    internal: true
    ipam:
      config: [{subnet: 10.77.0.0/24}]
  data: {internal: true}
  outbound: {}
volumes:
  db: {}
  redis: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
