name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/neuroflexdev/ciback

jobs:
  quality:
    name: Tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ciuser
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: cidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciuser -d cidb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://ciuser:cipassword@localhost:5432/cidb
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q app main.py

      - name: Validate deployment scripts
        run: bash -n deploy/dev-platform/bootstrap.sh deploy/dev-platform/lernium-deploy

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env PUBLIC_HOST=dev.platform.lernium.ru \
            --volume "${PWD}/deploy/dev-platform/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate deployment compose file
        run: |
          docker compose \
            --file deploy/dev-platform/docker-compose.yml \
            --project-directory deploy/dev-platform \
            --env-file deploy/dev-platform/.env.example \
            config --quiet

      - name: Run tests
        run: python -m pytest -q

      - name: Validate migrations from an empty database
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head

  image:
    name: Build and publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/neuroflexdev/ciback:sha-${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ciback
          cache-to: type=gha,mode=max,scope=ciback

  image-security:
    name: Scan image and publish SBOM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/neuroflexdev/ciback@${{ needs.image.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable image
        run: docker pull "${IMAGE}"

      - name: Write vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/out" \
            anchore/syft@sha256:c15fa8af4c25edd72c0daf026d095fe51adbcfc7ad5d79a66e93d88f249e5abb \
            "${IMAGE}" \
            -o "spdx-json=/out/ciback-${GITHUB_SHA}.spdx.json"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ciback-${{ github.sha }}-sbom
          path: ${{ runner.temp }}/ciback-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [image, image-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://dev.platform.lernium.ru/api/healthz
    concurrency:
      group: lernium-staging-backend
      cancel-in-progress: false
    steps:
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
          BASTION_HOST: ${{ vars.STAGING_BASTION_HOST }}
          BASTION_USER: ${{ vars.STAGING_BASTION_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${BASTION_HOST}"
          test -n "${BASTION_USER}"
          test -n "${DEPLOY_KEY}"
          test -n "${KNOWN_HOSTS}"
          [[ "${ACTOR}" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[0-9.]+$ ]]
          [[ "${BASTION_HOST}" =~ ^[0-9.]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${BASTION_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

          printf '%s\n' "${GHCR_TOKEN}" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o "ProxyCommand=ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ${HOME}/.ssh/id_ed25519 -W %h:%p ${BASTION_USER}@${BASTION_HOST}" \
            -i "${HOME}/.ssh/id_ed25519" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/lernium-deploy backend ${IMAGE} ${ACTOR}"
