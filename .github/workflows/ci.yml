name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy this branch to DEV after all checks pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/neuroflexdev/ciback

jobs:
  lint:
    name: Python, SQL, Docker and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install lint dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lint.txt
      - name: Check Python
        run: |
          ruff check --output-format github .
          ruff format --check .
      - name: Check SQL
        run: python scripts/lint_sql.py
      - name: Install checksum-pinned native tools
        run: python scripts/lint_native.py install
      - name: Check workflows
        run: python scripts/lint_native.py actionlint
      - name: Check Dockerfile
        run: python scripts/lint_native.py hadolint
      - name: Scan repository snapshot for secrets
        run: |
          # Checkout contains tracked source only. Scan every file in the snapshot,
          # including previously committed files, without obsolete historical secrets.
          snapshot="$(mktemp -d)"
          git archive HEAD | tar -x -C "$snapshot"
          python scripts/lint_native.py gitleaks dir --redact --no-banner "$snapshot"
      - name: Scan introduced commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            python scripts/lint_native.py gitleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD"
          fi
      - name: Build import dependency map
        if: always()
        run: |
          mkdir -p lint-reports
          ruff analyze graph app --detect-string-imports > lint-reports/imports.json
      - name: Upload import map
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-import-map
          path: lint-reports/imports.json
          if-no-files-found: error

  security:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install Semgrep in its own environment
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Run local security rules
        run: semgrep scan --config .semgrep.yml --error --strict --metrics off --disable-version-check app scripts main.py admin_main.py
      - name: Test security rules against unsafe and safe examples
        run: semgrep scan --test --config .semgrep.yml tests/security/.semgrep.py --metrics off --disable-version-check

  quality:
    name: Tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ciuser
          POSTGRES_PASSWORD: cipassword
          POSTGRES_DB: cidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciuser -d cidb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://ciuser:cipassword@localhost:5432/cidb
      TEST_POSTGRES_DSN: postgresql+psycopg2://ciuser:cipassword@localhost:5432/cidb
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up PDF math runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pdf_runtime/package-lock.json

      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config ffmpeg
          npm ci --omit=dev --ignore-scripts --prefix pdf_runtime

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check types in core and API schemas
        run: ty check --output-format github

      - name: Report types across the application (migration visibility)
        run: |
          mkdir -p lint-reports
          ty check --config 'src.include=["app", "main.py", "admin_main.py", "scripts/lint_sql.py", "scripts/lint_native.py"]' --output-format sarif --exit-zero > lint-reports/ty-full.sarif

      - name: Upload full type report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-type-report
          path: lint-reports/ty-full.sarif
          if-no-files-found: warn

      - name: Audit installed application and development dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Prepare offline tokenizer
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"

      - name: Compile application
        run: python -m compileall -q app main.py admin_main.py

      - name: Validate deployment scripts
        run: |
          bash -n deploy/dev-platform/bootstrap.sh
          bash -n deploy/dev-platform/lernium-deploy

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env PUBLIC_HOST=dev.platform.lernium.ru \
            --volume "${PWD}/deploy/dev-platform/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate deployment compose file
        run: |
          docker compose \
            --file deploy/dev-platform/docker-compose.yml \
            --project-directory deploy/dev-platform \
            --env-file deploy/dev-platform/.env.example \
            config --quiet

      - name: Run tests
        run: python -m pytest -q

      - name: Validate migrations from an empty database
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python scripts/check_ai_persistence.py
          # The release head joins two branches; use their explicit common ancestor.
          python -m alembic downgrade mobile_0043
          python -m alembic upgrade head

  e2e:
    name: PostgreSQL HTTP user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: ci-e2e-only
          POSTGRES_DB: e2e_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_POSTGRES_DSN: postgresql+psycopg2://e2e:ci-e2e-only@localhost:5432/e2e_bootstrap
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install native Python dependency prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare offline tokenizer
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - name: Run HTTP journeys on migrated PostgreSQL
        run: python -m pytest -c e2e/pytest.ini e2e -q --junitxml=lint-reports/e2e.xml
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: lint-reports/e2e.xml
          if-no-files-found: warn

  image:
    name: Build and publish image
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: [quality, lint, security, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/neuroflexdev/ciback:sha-${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true
          # Re-run OS updates even when the application/dependency layers are unchanged.
          no-cache-filters: system_packages
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ciback
          cache-to: type=gha,mode=max,scope=ciback

  image-security:
    name: Scan image and publish SBOM
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/neuroflexdev/ciback@${{ needs.image.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable image
        run: docker pull "${IMAGE}"

      - name: Write vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/out" \
            anchore/syft@sha256:c15fa8af4c25edd72c0daf026d095fe51adbcfc7ad5d79a66e93d88f249e5abb \
            "${IMAGE}" \
            -o "spdx-json=/out/ciback-${GITHUB_SHA}.spdx.json"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ciback-${{ github.sha }}-sbom
          path: ${{ runner.temp }}/ciback-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to staging
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.deploy_staging)
    needs: [image, image-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://dev.platform.lernium.ru/api/healthz
    concurrency:
      group: lernium-staging-backend
      cancel-in-progress: false
    steps:
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
          BASTION_HOST: ${{ vars.STAGING_BASTION_HOST }}
          BASTION_USER: ${{ vars.STAGING_BASTION_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_KEY}"
          test -n "${KNOWN_HOSTS}"
          [[ "${ACTOR}" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[0-9.]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          proxy_options=()
          if [[ -n "${BASTION_HOST}" || -n "${BASTION_USER}" ]]; then
            [[ "${BASTION_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
            [[ "${BASTION_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
            proxy_options=(-o "ProxyCommand=ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ${HOME}/.ssh/id_ed25519 -W %h:%p ${BASTION_USER}@${BASTION_HOST}")
          fi

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

          printf '%s\n' "${GHCR_TOKEN}" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            "${proxy_options[@]}" \
            -i "${HOME}/.ssh/id_ed25519" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/lernium-deploy backend ${IMAGE} ${ACTOR}"
