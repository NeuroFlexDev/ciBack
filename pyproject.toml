[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mlcourse", "uploads"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I",
    "B", "PLE", "ASYNC",
    "C901", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]
# Some entrypoints intentionally bootstrap sys.path; legacy ORM names use l/I.
ignore = ["E402", "E741"]

[tool.ruff.lint.per-file-ignores]
# Imported pytest fixtures are injected by name into test functions.
"tests/**" = ["F401", "F811", "C901", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
# Fixture setup and end-to-end scenarios are measured by behavior and assertions.
"e2e/**" = ["C901", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI factories describe request/dependency metadata at registration time.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path",
    "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
    "fastapi.Security", "app.services.integration_access.require_scope",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-statements = 50

[tool.ty.environment]
python-version = "3.11"
python-platform = "all"

[tool.ty.src]
# Stage one: boundary contracts/configuration. Column-based ORM consumers need
# a separate migration to SQLAlchemy Mapped before expanding this scope.
include = ["app/core", "app/schemas", "scripts/lint_sql.py", "scripts/lint_native.py"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
# Check embedded SQL syntax without enforcing Python-string whitespace.
rules = ["CP01", "CP02", "ST01", "ST02"]

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "lower"

[tool.pytest.ini_options]
testpaths = ["tests"]
