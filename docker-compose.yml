services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cidb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciuser} -d ${POSTGRES_DB:-cidb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ciuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-cidb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-dev}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ciuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-cidb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      UPLOAD_DIR: /data/uploads
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-25}
      DOCUMENT_CHUNK_CHARS: ${DOCUMENT_CHUNK_CHARS:-2000}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-200}
      GRAPH_CONTEXT_MAX_CHARS: ${GRAPH_CONTEXT_MAX_CHARS:-60000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      JWT_ALG: ${JWT_ALG:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_MINUTES: ${REFRESH_TOKEN_TTL_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      HUGGINGCHAT_PROXY_URL: ${HUGGINGCHAT_PROXY_URL:-http://ml-proxy:8001}
      VSELLM_API_KEY: ${VSELLM_API_KEY:-}
      VSELLM_BASE_URL: ${VSELLM_BASE_URL:-https://api.vsellm.ru/v1}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-vsellm}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-openai/gpt-5.1}
      WEB_SEARCH_MAX_QUERIES: ${WEB_SEARCH_MAX_QUERIES:-1}
      WEB_SEARCH_RESERVATION_RUB: ${WEB_SEARCH_RESERVATION_RUB:-20}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-45}
      WEB_SEARCH_MAX_OUTPUT_TOKENS: ${WEB_SEARCH_MAX_OUTPUT_TOKENS:-1200}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-openai/gpt-5.4-mini}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-openai/gpt-5.4-mini}
      AI_MODEL_WRITER: ${AI_MODEL_WRITER:-openai/gpt-5.4-mini}
      AI_MODEL_CRITIC: ${AI_MODEL_CRITIC:-anthropic/claude-sonnet-4.6}
      AI_MODEL_FALLBACK: ${AI_MODEL_FALLBACK:-google/gemini-2.5-flash}
      AI_MODEL_EMBEDDING: ${AI_MODEL_EMBEDDING:-openai/text-embedding-3-small}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-0}
      AI_MAX_SOURCE_CHARS: ${AI_MAX_SOURCE_CHARS:-500000}
      AI_INGESTION_BATCH_CHARS: ${AI_INGESTION_BATCH_CHARS:-10000}
      AI_MAX_REVISIONS: ${AI_MAX_REVISIONS:-2}
      AI_QA_MIN_SCORE: ${AI_QA_MIN_SCORE:-0.8}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-86400}
      AI_ROUTING_MODE: ${AI_ROUTING_MODE:-adaptive}
      AI_PROVIDERS: ${AI_PROVIDERS:-[]}
      AI_PROVIDER_COOLDOWN_SECONDS: ${AI_PROVIDER_COOLDOWN_SECONDS:-60}
      AI_TOKEN_FORECAST_PATH: ${AI_TOKEN_FORECAST_PATH:-app/ai/data/token_forecast.json}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_ROUTING_CANDIDATES: ${AI_ROUTING_CANDIDATES:-[]}
      AI_ROUTING_MIN_SAMPLES: ${AI_ROUTING_MIN_SAMPLES:-10}
      AI_ROUTING_MIN_PASS_RATE: ${AI_ROUTING_MIN_PASS_RATE:-0.85}
      AI_ROUTING_HISTORY_LIMIT: ${AI_ROUTING_HISTORY_LIMIT:-200}
      AI_ROUTING_COOLDOWN_SECONDS: ${AI_ROUTING_COOLDOWN_SECONDS:-300}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-true}
      AI_OCR_MAX_PAGES: ${AI_OCR_MAX_PAGES:-30}
      AI_CHAT_CONTEXT_TOKENS: ${AI_CHAT_CONTEXT_TOKENS:-12000}
      AI_MAX_TOKENS_PER_RUN: ${AI_MAX_TOKENS_PER_RUN:-600000}
      AI_MAX_CALLS_PER_RUN: ${AI_MAX_CALLS_PER_RUN:-180}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-3600}
      AI_CHECKPOINT_SQLITE_PATH: /data/uploads/ai-checkpoints.sqlite
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_MODEL_CANDIDATES: ${HF_MODEL_CANDIDATES:-}
      HF_API_URL: ${HF_API_URL:-}
      GIGA_CLIENT_ID: ${GIGA_CLIENT_ID:-}
      GIGA_CLIENT_SECRET: ${GIGA_CLIENT_SECRET:-}
      GIGA_SCOPE: ${GIGA_SCOPE:-GIGACHAT_API_PERS}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: rq worker generation --with-scheduler --url redis://redis:6379/0
    volumes:
      - ./:/app
      - uploads_data:/data/uploads
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ciuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-cidb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      GRAPH_CONTEXT_MAX_CHARS: ${GRAPH_CONTEXT_MAX_CHARS:-60000}
      VSELLM_API_KEY: ${VSELLM_API_KEY:-}
      VSELLM_BASE_URL: ${VSELLM_BASE_URL:-https://api.vsellm.ru/v1}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-vsellm}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-openai/gpt-5.1}
      WEB_SEARCH_MAX_QUERIES: ${WEB_SEARCH_MAX_QUERIES:-1}
      WEB_SEARCH_RESERVATION_RUB: ${WEB_SEARCH_RESERVATION_RUB:-20}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-45}
      WEB_SEARCH_MAX_OUTPUT_TOKENS: ${WEB_SEARCH_MAX_OUTPUT_TOKENS:-1200}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-openai/gpt-5.4-mini}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-openai/gpt-5.4-mini}
      AI_MODEL_WRITER: ${AI_MODEL_WRITER:-openai/gpt-5.4-mini}
      AI_MODEL_CRITIC: ${AI_MODEL_CRITIC:-anthropic/claude-sonnet-4.6}
      AI_MODEL_FALLBACK: ${AI_MODEL_FALLBACK:-google/gemini-2.5-flash}
      AI_MODEL_EMBEDDING: ${AI_MODEL_EMBEDDING:-openai/text-embedding-3-small}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-0}
      AI_MAX_SOURCE_CHARS: ${AI_MAX_SOURCE_CHARS:-500000}
      AI_INGESTION_BATCH_CHARS: ${AI_INGESTION_BATCH_CHARS:-10000}
      AI_MAX_REVISIONS: ${AI_MAX_REVISIONS:-2}
      AI_QA_MIN_SCORE: ${AI_QA_MIN_SCORE:-0.8}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-86400}
      AI_ROUTING_MODE: ${AI_ROUTING_MODE:-adaptive}
      AI_PROVIDERS: ${AI_PROVIDERS:-[]}
      AI_PROVIDER_COOLDOWN_SECONDS: ${AI_PROVIDER_COOLDOWN_SECONDS:-60}
      AI_TOKEN_FORECAST_PATH: ${AI_TOKEN_FORECAST_PATH:-app/ai/data/token_forecast.json}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_ROUTING_CANDIDATES: ${AI_ROUTING_CANDIDATES:-[]}
      AI_ROUTING_MIN_SAMPLES: ${AI_ROUTING_MIN_SAMPLES:-10}
      AI_ROUTING_MIN_PASS_RATE: ${AI_ROUTING_MIN_PASS_RATE:-0.85}
      AI_ROUTING_HISTORY_LIMIT: ${AI_ROUTING_HISTORY_LIMIT:-200}
      AI_ROUTING_COOLDOWN_SECONDS: ${AI_ROUTING_COOLDOWN_SECONDS:-300}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-true}
      AI_OCR_MAX_PAGES: ${AI_OCR_MAX_PAGES:-30}
      AI_CHAT_CONTEXT_TOKENS: ${AI_CHAT_CONTEXT_TOKENS:-12000}
      AI_MAX_TOKENS_PER_RUN: ${AI_MAX_TOKENS_PER_RUN:-600000}
      AI_MAX_CALLS_PER_RUN: ${AI_MAX_CALLS_PER_RUN:-180}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-3600}
      AI_CHECKPOINT_SQLITE_PATH: /data/uploads/ai-checkpoints.sqlite
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  uploads_data:
